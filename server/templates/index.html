<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Career Guidance</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f5f5f5;
    }

    .landing-container {
      background-color: #fff;
      padding: 50px 40px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 400px;
      width: 100%;
    }

    .landing-container h1 {
      font-size: 2rem;
      margin-bottom: 20px;
      color: #21262d;
    }

    .landing-container p {
      font-size: 1rem;
      color: #555;
      margin-bottom: 30px;
    }

    .landing-container .btn {
      display: block;
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .btn-login {
      background-color: #58a6ff;
      color: #fff;
    }

    .btn-login:hover {
      background-color: #3078d7;
    }

    .btn-signup {
      background-color: #e2e8f0;
      color: #21262d;
    }

    .btn-signup:hover {
      background-color: #cbd5e1;
    }
  </style>
</head>
<body>
  <div class="landing-container">
    <h1>Welcome to CareerAI ✨</h1>
    <p>Your one-stop personalized career & education advisor. Start exploring your career path today!</p>
    
    <a href="{{ url_for('userRouter.login') }}">
      <button class="btn btn-login">Login</button>
    </a>
    <a href="{{ url_for('userRouter.signup') }}">
      <button class="btn btn-signup">Sign Up</button>
    </a>
  </div>
</body>
</html>
