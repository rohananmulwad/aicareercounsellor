<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Career Roadmap - AI Career Guidance</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='styles.css') }}"
    />
    <style>
      :root {
        --bg-color: #f8f9fa;
        --text-color: #212529;
        --primary-color: #0d6efd;
        --secondary-color: #6c757d;
        --completed-color: #198754;
        --in-progress-color: #ffc107;
        --border-color: #dee2e6;
        --card-bg: #ffffff;
        --shadow-color: rgba(0, 0, 0, 0.1);
        --line-color: #ced4da;
        --completed-line-color: #198754;
      }

      body {
        font-family: 'Poppins', sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100vh;
        overflow-x: hidden;
      }

      .roadmap-container {
        width: 100%;
        max-width: 1200px;
        margin-top: 20px;
        position: relative;
      }

      .timeline {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
        gap: 40px;
        padding: 40px 0;
        position: relative;
      }
      .lane {
        min-width: 350px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        gap: 25px;
        position: relative;
        padding: 20px;
        border-radius: 12px;
        background: var(--card-bg);
        box-shadow: 0 4px 12px var(--shadow-color);
      }
      .lane-title {
        background: #21262d;
        border: 1px solid #30363d;
        color: #f0f6fc;
        padding: 16px;
        border-radius: 10px;
        font-size: 1.3rem;
        font-weight: 600;
        text-align: center;
        margin-bottom: 16px;
        position: relative;
      }
      .lane-title::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(90deg, #58a6ff, #f78166, #79c0ff);
        border-radius: 10px 10px 0 0;
      }
      .skill-card {
        background: #f1f3f5;
        border: 1px solid #dee2e6;
        border-radius: 10px;
        padding: 16px;
        margin-bottom: 12px;
        transition: all 0.2s ease;
        cursor: pointer;
      }
      .skill-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
      }
      .skill-card.completed {
        border-color: #198754;
      }
      .skill-card.in-progress {
        border-color: #ffc107;
      }
      .skill-card.locked {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .card-title {
        font-size: 1rem;
        font-weight: 600;
        color: #212529;
      }
      .status-indicator {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #ccc;
      }
      .generate-btn {
        background: linear-gradient(90deg, #58a6ff, #f78166, #79c0ff);
        color: #fff;
        padding: 12px 28px;
        font-size: 1rem;
        font-weight: 600;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(88, 166, 255, 0.4);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
      }

      .generate-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 6px 20px rgba(247, 129, 102, 0.6);
      }

      .generate-btn:active {
        transform: translateY(0);
        box-shadow: 0 4px 15px rgba(121, 192, 255, 0.4);
      }

      .generate-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        box-shadow: none;
      }
      .skill-card.completed .status-indicator {
        background: #198754;
      }
      .skill-card.in-progress .status-indicator {
        background: #ffc107;
      }

      /* Loading Spinner */
      .spinner {
        border: 4px solid var(--border-color);
        border-top: 4px solid var(--primary-color);
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 20px auto;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .mindmap-container {
        display: flex;
        justify-content: center;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-icon ai">AI</div>
        <h3 class="sidebar-title">CareerAI</h3>
      </div>
      <nav class="sidebar-nav">
        <a
          href="{{ url_for('userRouter.dashboard') }}"
          style="text-decoration: none; color: inherit; display: block"
        >
          <div class="sidebar-item">
            <div class="sidebar-icon">🏠</div>
            <span class="sidebar-label">Dashboard</span>
          </div>
        </a>

        <div class="sidebar-item" onclick="navigateTo('assessment')">
          📊 Quiz
        </div>
        <div class="sidebar-item" onclick="navigateTo('careers')">
          🔍 Explore Courses
        </div>
        <div class="sidebar-item" onclick="navigateTo('skills')">
          🎯 Skill Advisor
        </div>
        <a
          href="{{ url_for('roadmap.genRoadMap') }}"
          style="text-decoration: none; color: inherit; display: block"
        >
          <div class="sidebar-item">
            <div class="sidebar-icon">🗺️</div>
            <span class="sidebar-label">Career Roadmap</span>
          </div>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-item" onclick="navigateTo('settings')">
          <div class="sidebar-icon">⚙️</div>
          <span class="sidebar-label">Settings</span>
        </div>
        <div class="sidebar-item" onclick="navigateTo('help')">
          <div class="sidebar-icon">❓</div>
          <span class="sidebar-label">Help & Support</span>
        </div>
      </div>
    </div>

    <div class="main-content" id="main-content">
      <div class="container">
        <div class="header">
          <div class="welcome-text">
            <h1>Your Career Roadmap 🗺️</h1>
            <p>Your personalized path to success in Software Development</p>
          </div>
          <div class="header-actions">
            <button id="generateBtn" class="generate-btn">
              Generate My Roadmap
            </button>
          </div>
        </div>

        <div id="loading-spinner" style="display: none; text-align: center; margin-top: 50px;">
          <h3>Loading Roadmap...</h3>
          <div class="spinner"></div>
        </div>

        <div id="roadmapContainer">
            <div id="timeline" class="timeline"></div>
        </div>
      </div>
    </div>

    <div
      class="chat-widget"
      style="position: fixed; bottom: 20px; right: 20px; z-index: 1000"
    >
      <button
        class="chat-toggle"
        onclick="toggleChat()"
        style="
          padding: 10px 14px;
          border-radius: 50%;
          background-color: #58a6ff;
          color: white;
          border: none;
          cursor: pointer;
        "
      >
        💬
      </button>

      <div
        id="chatWindow"
        style="
          position: absolute;
          bottom: 60px;
          right: 0;
          width: 320px;
          max-height: 400px;
          display: none;
          flex-direction: column;
          background-color: #fff;
          border-radius: 10px;
          box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
          overflow: hidden;
          transition: all 0.3s ease-in-out;
          transform: translateY(20px);
          opacity: 0;
        "
      >
        <div
          class="chat-header"
          style="
            background-color: #21262d;
            color: #f0f6fc;
            padding: 10px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
          "
        >
          <h4>AI Career Coach</h4>
          <button
            onclick="toggleChat()"
            style="
              background: none;
              border: none;
              color: #f0f6fc;
              cursor: pointer;
              font-size: 18px;
            "
          >
            ×
          </button>
        </div>

        <div id="chatMessages" style="flex: 1; padding: 10px; overflow-y: auto">
          <div class="bot-message">
            Hi! I'm your AI career coach. How can I help you today?
          </div>
        </div>

        <div style="display: flex; border-top: 1px solid #ddd">
          <input
            type="text"
            id="chatInput"
            placeholder="Type your question..."
            style="flex: 1; padding: 8px; border: none; outline: none"
            onkeydown="if(event.key==='Enter'){ sendMessage(); }"
          />
          <button
            onclick="sendMessage()"
            style="
              padding: 8px 12px;
              background-color: #58a6ff;
              border: none;
              color: white;
              cursor: pointer;
              border-radius: 0 5px 5px 0;
            "
          >
            Send
          </button>
        </div>
      </div>
    </div>
    
    <script>
        async function generateRoadmap() {
            const generateBtn = document.getElementById("generateBtn");
            const loadingSpinner = document.getElementById("loading-spinner");
            const roadmapContainer = document.getElementById("roadmapContainer");
            const timeline = document.getElementById("timeline");

            try {
                // Show loading state
                generateBtn.disabled = true;
                loadingSpinner.style.display = "block";
                roadmapContainer.style.display = "none";
                
                // Fetch data from Flask backend
                const response = await fetch("/roadmap/genroadmapData", {
                    method: "POST",
                });
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                renderRoadmap(data);
                
                // Hide loading state and show roadmap
                loadingSpinner.style.display = "none";
                roadmapContainer.style.display = "block";
            } catch (err) {
                console.error("Error fetching or rendering roadmap:", err);
                loadingSpinner.textContent = "Failed to load roadmap. Please try again later.";
            } finally {
                generateBtn.disabled = false;
            }
        }

        function renderRoadmap(data) {
            const timeline = document.getElementById("timeline");
            timeline.innerHTML = "";

            // Each lane
            data.lanes.forEach((lane, laneIndex) => {
                const laneDiv = document.createElement("div");
                laneDiv.className = "lane";
                laneDiv.innerHTML = `<div class="lane-title">${lane.title}</div>`;

                // Each card
                lane.cards.forEach((card) => {
                    const cardDiv = document.createElement("div");
                    cardDiv.className = `skill-card ${card.status}`;
                    cardDiv.dataset.id = card.id; // Add data-id for future interaction if needed
                    cardDiv.innerHTML = `
                        <div class="card-header">
                            <h4 class="card-title">${card.title}</h4>
                            <span class="status-indicator"></span>
                        </div>`;
                    laneDiv.appendChild(cardDiv);
                });

                timeline.appendChild(laneDiv);
            });
        }

        // Event listener for the generate button
        document.getElementById("generateBtn").addEventListener("click", generateRoadmap);
        
        // --- Dummy functions for the chat widget to prevent errors ---
        function toggleChat() {
            const chatWindow = document.getElementById('chatWindow');
            if (chatWindow.style.display === 'none' || chatWindow.style.display === '') {
                chatWindow.style.display = 'flex';
                setTimeout(() => {
                    chatWindow.style.transform = 'translateY(0)';
                    chatWindow.style.opacity = '1';
                }, 10);
            } else {
                chatWindow.style.transform = 'translateY(20px)';
                chatWindow.style.opacity = '0';
                setTimeout(() => {
                    chatWindow.style.display = 'none';
                }, 300);
            }
        }
        function sendMessage() {
            const chatInput = document.getElementById('chatInput');
            const message = chatInput.value.trim();
            if (message) {
                const chatMessages = document.getElementById('chatMessages');
                const userMessageDiv = document.createElement('div');
                userMessageDiv.className = 'user-message';
                userMessageDiv.textContent = message;
                chatMessages.appendChild(userMessageDiv);
                chatInput.value = '';
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        }
    </script>
  </body>
</html>
