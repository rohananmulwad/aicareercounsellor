<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login - CareerAI</title>
<style>
  body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    min-height: 100vh;
    background-color: #f5f5f5;
  }

  /* Sidebar */
  .sidebar {
    width: 250px;
    background-color: #21262d;
    color: #f0f6fc;
    display: flex;
    flex-direction: column;
    padding: 30px 20px;
  }

  .sidebar h3 {
    margin-top: 0;
    font-size: 1.8rem;
    margin-bottom: 40px;
    text-align: center;
    letter-spacing: 1px;
  }

  .sidebar-item {
    display: flex;
    align-items: center;
    padding: 12px 10px;
    border-radius: 10px;
    cursor: pointer;
    margin-bottom: 15px;
    transition: all 0.2s ease;
    color: #f0f6fc;
    text-decoration: none;
  }

  .sidebar-item:hover {
    background-color: #30363d;
  }

  .sidebar-icon {
    margin-right: 12px;
    font-size: 1.2rem;
  }

  /* Main content */
  .main-content {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .login-container {
    background-color: #fff;
    padding: 50px 35px;
    border-radius: 15px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    text-align: center;
  }

  .login-container h1 {
    margin-bottom: 30px;
    font-size: 2rem;
    color: #21262d;
  }

  .login-container form {
    display: flex;
    flex-direction: column;
  }

  .login-container input {
    padding: 14px 16px;
    margin-bottom: 20px;
    border-radius: 10px;
    border: 1px solid #ccc;
    font-size: 1rem;
    outline: none;
    transition: all 0.2s ease;
  }

  .login-container input:focus {
    border-color: #58a6ff;
    box-shadow: 0 0 8px rgba(88, 166, 255, 0.3);
  }

  .login-container button {
    padding: 14px;
    border: none;
    border-radius: 10px;
    background-color: #58a6ff;
    color: white;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .login-container button:hover {
    background-color: #3078d7;
  }

  /* Flash messages */
  .flash-messages {
    margin-bottom: 20px;
    text-align: left;
  }

  .flash {
    padding: 12px;
    margin-bottom: 12px;
    border-radius: 8px;
    font-size: 0.95rem;
  }

  .flash.error {
    background-color: #f8d7da;
    color: #721c24;
    border: 1px solid #f5c6cb;
  }

  .flash.success {
    background-color: #d4edda;
    color: #155724;
    border: 1px solid #c3e6cb;
  }

  .flash.info {
    background-color: #d1ecf1;
    color: #0c5460;
    border: 1px solid #bee5eb;
  }

  /* Responsive */
  @media(max-width: 768px) {
    body {
      flex-direction: column;
    }
    .sidebar {
      width: 100%;
      flex-direction: row;
      overflow-x: auto;
      padding: 15px;
    }
    .sidebar h3 {
      font-size: 1.5rem;
      margin-bottom: 0;
      margin-right: 20px;
    }
    .sidebar-item {
      margin-bottom: 0;
      margin-right: 12px;
    }
    .main-content {
      padding: 15px;
    }
  }
</style>
</head>
<body>

  <!-- Main Content -->
  <div class="main-content">
    <div class="login-container">
      <h1>Login to CareerAI</h1>

      <!-- Flash messages -->
      <div class="flash-messages">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}
      </div>

      <form method="POST">
        <input type="text" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
      </form>
    </div>
  </div>
</body>
</html>
